name: Test app syntax

on:
  push:
    branches:
      - supabase-sync-test
  pull_request:
    branches:
      - main

jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline script blocks found")
          Path("/tmp/app-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/app-inline.js
