name: Vendor barcode decoder
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download pinned ZXing browser decoder
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 --output vendor/zxing-browser.min.js https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js
          test -s vendor/zxing-browser.min.js
          head -c 100 vendor/zxing-browser.min.js | grep -q .
      - name: Commit vendored decoder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/zxing-browser.min.js
          git commit -m "Vendor ZXing browser barcode decoder" || exit 0
          git push origin HEAD:main
