name: Deploy Supabase test app
# Diagnostic runner job added to isolate why the Pages deployment job fails before steps start.
on:
  push:
    branches:
      - supabase-sync-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub Actions runner starts
        run: |
          echo "Diagnostic runner started successfully."
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

  deploy:
    needs: runner-diagnostic
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload test app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy test app
        id: deployment
        uses: actions/deploy-pages@v4
